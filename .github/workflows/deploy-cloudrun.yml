# Deploy S.E.L.E.N.E. Ops to Cloud Run (seleneops-spaceapps-1115, us-central1).
# Auth is Workload Identity Federation; the OIDC provider is restricted to
# Prodkillers/Atlas on refs/heads/main, so this job can only run from main.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run frontend tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run backend tests
        working-directory: server
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/seleneops-spaceapps-1115/atlas/selene-ops:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/342756977960/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@seleneops-spaceapps-1115.iam.gserviceaccount.com
          token_format: access_token

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: seleneops-spaceapps-1115
          service: selene-ops
          region: us-central1
          image: us-central1-docker.pkg.dev/seleneops-spaceapps-1115/atlas/selene-ops:${{ github.sha }}
          flags: >-
            --cpu=1
            --memory=512Mi
            --min-instances=1
            --max-instances=2
            --cpu-boost
            --concurrency=80
            --timeout=60
            --port=8080
            --allow-unauthenticated
            --service-account=atlas-runtime@seleneops-spaceapps-1115.iam.gserviceaccount.com
            --set-env-vars=^@^SERVE_STATIC=1@ALLOWED_ORIGINS=https://selene-ops-342756977960.us-central1.run.app,https://selene-ops-sxhzgdnenq-uc.a.run.app,https://seleneops.earth

      - name: Health check
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-all-errors --retry-delay 3 \
            "${{ steps.deploy.outputs.url }}/api/health"
          echo
