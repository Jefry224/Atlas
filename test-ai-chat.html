<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporary test · Flight Director</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #101820; color: #e8edf0; }
    body { margin: 0 auto; max-width: 780px; min-height: 100vh; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-size: 1.25rem; margin: 0; }
    .notice { color: #aab9c2; font-size: .9rem; margin: 0; }
    #messages { flex: 1; min-height: 240px; max-height: 55vh; overflow: auto; border: 1px solid #34434c; border-radius: 12px; padding: 16px; background: #16232b; }
    .message { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px 14px; border-radius: 10px; margin: 0 0 12px; }
    .user { background: #23444a; margin-left: 12%; }
    .assistant { background: #26323a; margin-right: 12%; }
    .error { color: #ffb4a9; }
    label { display: block; font-size: .85rem; color: #aab9c2; margin-bottom: 5px; }
    textarea, input { width: 100%; box-sizing: border-box; border: 1px solid #485963; background: #16232b; color: inherit; border-radius: 8px; padding: 10px; font: inherit; }
    #context { min-height: 74px; font: 13px/1.4 ui-monospace, monospace; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    button { border: 0; border-radius: 8px; background: #80d8c4; color: #10211f; font: inherit; font-weight: 700; padding: 0 18px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    @media (max-width: 520px) { body { padding: 16px; } form { grid-template-columns: 1fr; } button { min-height: 44px; } }
  </style>
</head>
<body>
  <h1>Flight Director temporary test</h1>
  <p class="notice">Queries <code>/api/copilot</code>. Keeps recent history only in this tab; the key stays on the server.</p>
  <div id="messages" aria-live="polite"><p class="notice">Type a question to check the connection with the configured model.</p></div>
  <div>
    <label for="context">JSON context (optional)</label>
    <textarea id="context" spellcheck="false">{}</textarea>
  </div>
  <form id="chat-form">
    <input id="question" autocomplete="off" maxlength="600" placeholder="Type your question…" required>
    <button id="send" type="submit">Send</button>
  </form>
  <script>
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#chat-form');
    const questionInput = document.querySelector('#question');
    const sendButton = document.querySelector('#send');
    const history = [];
    const maxHistoryMessages = 12;

    function addMessage(text, role, extraClass = '') {
      const item = document.createElement('p');
      item.className = `message ${role} ${extraClass}`;
      item.textContent = text;
      messages.append(item);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question) return;

      let context;
      try {
        context = JSON.parse(document.querySelector('#context').value || '{}');
        if (!context || Array.isArray(context) || typeof context !== 'object') throw new Error('El contexto debe ser un objeto JSON.');
      } catch (error) {
        addMessage(`Invalid context: ${error.message}`, 'assistant', 'error');
        return;
      }

      addMessage(question, 'user');
      questionInput.value = '';
      sendButton.disabled = true;
      sendButton.textContent = 'Consultando…';
      try {
        const response = await fetch('/api/copilot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, context, history }),
        });
        if (!response.ok) {
          const result = await response.json();
          throw new Error(`${response.status}: ${result.error || 'Server error'}`);
        }
        const result = await response.json();
        if (!response.ok) throw new Error(`${response.status}: ${result.error || 'Server error'}`);
        addMessage(result.answer, 'assistant');
        history.push({ role: 'user', content: question }, { role: 'assistant', content: result.answer });
        if (history.length > maxHistoryMessages) history.splice(0, history.length - maxHistoryMessages);
      } catch (error) {
        addMessage(`Could not get an answer: ${error.message}`, 'assistant', 'error');
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = 'Send';
        questionInput.focus();
      }
    });
  </script>
</body>
</html>
